name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK (arm64 — почти все телефоны)
        run: |
          gradle assembleDebug --no-daemon -PabiOnly=arm64-v8a -Psideload
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTranslator.apk

      - name: Build APK (armeabi-v7a — старые телефоны)
        run: |
          gradle assembleDebug --no-daemon -PabiOnly=armeabi-v7a -Psideload
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTranslator-armv7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: ScreenTranslator*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenTranslator.apk
            ScreenTranslator-armv7.apk
